[package]
name = "nexum"
version = "1.2.0"
description = "Nexum - PC telemetry, driver inventory and safe cleanup for Windows 10/11"
authors = ["Nexum"]
edition = "2021"
publish = false

[lib]
name = "nexum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary is linked with requireAdministrator (see build.rs); its (empty) unit-test
# harness would need an elevated shell, so it is not built by `cargo test`.
[[bin]]
name = "nexum"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wmi = "0.14"
dirs = "5"
tauri-plugin-notification = "2"
# In-app updates (CONTRACT 2.15). Used from Rust only (src/updater.rs): no JS package and no
# capability, so the WebView cannot reach the plugin. Its `zip` feature (Tauri v1 archives)
# is left out because Nexum never calls the plugin's own installer.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Named directly because src/updater.rs uses their API; both are already in the tree.
semver = "1"
base64 = "0.23"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
