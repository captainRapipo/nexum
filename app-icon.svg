<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="512" cy="330" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#143436"/>
      <stop offset="0.45" stop-color="#0D1B1E"/>
      <stop offset="1" stop-color="#05090B"/>
    </radialGradient>
    <linearGradient id="edge" x1="512" y1="56" x2="512" y2="968" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#D4A359" stop-opacity="0.32"/>
    </linearGradient>
    <!-- ring + core are used inside the ×10 emblem group: coordinates in 64-unit emblem space -->
    <linearGradient id="ring" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7AF4E2"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#14A394"/>
    </linearGradient>
    <radialGradient id="core" cx="32" cy="26" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.03"/>
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile">
      <rect x="56" y="56" width="912" height="912" rx="208"/>
    </clipPath>
  </defs>

  <!-- Obsidian-teal tile -->
  <rect x="56" y="56" width="912" height="912" rx="208" fill="url(#bg)"/>

  <!-- Faint engineering grid inside the tile -->
  <g clip-path="url(#tile)" stroke="#2DD4BF" stroke-opacity="0.05" stroke-width="2">
    <path d="M56 248H968M56 440H968M56 632H968M56 824H968M248 56V968M440 56V968M632 56V968M824 56V968"/>
  </g>

  <!-- Tile edge -->
  <rect x="59" y="59" width="906" height="906" rx="205" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <!-- Bloom (filter applied in tile pixel space, emblem geometry scaled inside) -->
  <g filter="url(#bloom)" opacity="0.7">
    <g transform="translate(192 192) scale(10)">
      <polygon points="32,3.5 56.7,17.75 56.7,46.25 32,60.5 7.3,46.25 7.3,17.75" fill="none" stroke="#2DD4BF" stroke-width="3.4"/>
      <path d="M22 43V21l20 22V21" fill="none" stroke="#2DD4BF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Emblem: 64-unit mark scaled ×10, centred -->
  <g transform="translate(192 192) scale(10)">
    <!-- outer hexagon frame -->
    <polygon points="32,3.5 56.7,17.75 56.7,46.25 32,60.5 7.3,46.25 7.3,17.75"
             fill="url(#core)" stroke="url(#ring)" stroke-width="3.4" stroke-linejoin="round"/>

    <!-- inner gold trace ring -->
    <polygon points="32,11.5 49.75,21.75 49.75,42.25 32,52.5 14.25,42.25 14.25,21.75"
             fill="none" stroke="#D4A359" stroke-opacity="0.45" stroke-width="1.3"/>

    <!-- N circuit trace -->
    <path d="M22 43V21l20 22V21" fill="none" stroke="#2DD4BF" stroke-width="5.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 43V21l20 22V21" fill="none" stroke="#B5FFF4" stroke-opacity="0.35" stroke-width="1.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- terminals -->
    <circle cx="22" cy="43" r="3.4" fill="#2DD4BF" stroke="#081215" stroke-width="1.6"/>
    <circle cx="42" cy="21" r="3.4" fill="#2DD4BF" stroke="#081215" stroke-width="1.6"/>
    <circle cx="22" cy="21" r="4.4" fill="#D4A359" stroke="#081215" stroke-width="1.6"/>
    <circle cx="42" cy="43" r="4.4" fill="#D4A359" stroke="#081215" stroke-width="1.6"/>
    <circle cx="21" cy="20" r="1.2" fill="#FFF3D6" fill-opacity="0.75"/>
    <circle cx="41" cy="42" r="1.2" fill="#FFF3D6" fill-opacity="0.75"/>
  </g>
</svg>
