name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SIDECAR_TRIPLE: x86_64-pc-windows-msvc

jobs:
  # Source-level policy checks. Kept out of the build job so a copy-rule finding
  # never hides a build result; releases (sign / preview) need both jobs green.
  policy:
    name: Policy checks (no network, copy rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # MF-11: no network clients in Rust, C# or frontend sources (.github/network-allowlist.txt).
      - name: No network code (MF-11)
        run: node .github/scripts/check-network.mjs

      - name: Install frontend dependencies (typescript parser for the copy check)
        run: npm ci --ignore-scripts

      # CONTRACT §4.8 / §7.4: banned words in UI copy (.github/copy-allowlist.txt).
      - name: UI copy rules (CONTRACT §4.8)
        run: node .github/scripts/check-copy.mjs

      # CONTRACT §0 / §1.7.1 / §7.9: v1.1 reads AMD ADL tuning data only. No ADL "_Set"
      # entry point anywhere, imports only in Tuning/AdlNative.cs, whitelist enforced.
      - name: Read-only GPU tuning (CONTRACT §7.9)
        run: node .github/scripts/check-tuning-readonly.mjs

      # CONTRACT §0 anti-cheat stance: no code injection, hooks, cross-process memory
      # access or window messages to other processes. No allow-list.
      - name: No injection or hooks (CONTRACT §0)
        run: node .github/scripts/check-no-injection.mjs

  build:
    name: Build & test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # CONTRACT §7.7: Intel's signed PresentMon console exe is shipped unmodified through
      # bundle.resources. It must exist before anything compiles src-tauri (tauri-build
      # validates resources, including during 'cargo test'). The cache only saves the
      # download: the script re-checks SHA-256 + Authenticode (Valid, CN=Intel Corporation)
      # on every run and fails the job otherwise. URL and hash: .github/presentmon.json.
      - name: Cache PresentMon download
        uses: actions/cache@v4
        with:
          path: build/presentmon
          key: presentmon-${{ hashFiles('.github/presentmon.json') }}

      - name: Fetch and verify pinned PresentMon (CONTRACT §7.7)
        shell: pwsh
        run: ./.github/scripts/fetch-presentmon.ps1

      - name: Install frontend dependencies
        run: npm ci

      - name: Tauri CLI version (MF-8 needs >= 2.9.3 for signed NSIS plugins)
        shell: pwsh
        run: |
          $v = (npx --no-install tauri --version) -replace '[^0-9.]', ''
          Write-Host "tauri-cli $v"
          if ([version]$v -lt [version]'2.9.3') { throw "@tauri-apps/cli $v is older than 2.9.3 (MF-8 item 2)" }

      - name: Typecheck & build frontend
        run: npm run build

      - name: Build hardware sidecar (nexum-agent)
        shell: pwsh
        run: |
          dotnet publish nexum-agent/NexumAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o build/agent
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item build/agent/nexum-agent.exe "src-tauri/binaries/nexum-agent-$env:SIDECAR_TRIPLE.exe" -Force
          Get-ChildItem build/agent | Select-Object Name, Length | Format-Table -AutoSize

      # Pure-logic checks built into the agent (drive classifier, fan-safety hysteresis,
      # sensor units). No hardware access, no fan writes, no files. Exit code 0 = pass.
      - name: Sidecar self-test (--selftest)
        shell: pwsh
        run: |
          & build/agent/nexum-agent.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "nexum-agent --selftest failed (exit $LASTEXITCODE)" }

      # Runs only once the sidecar has a test project (any *.csproj referencing
      # Microsoft.NET.Test.Sdk or marked <IsTestProject>true</IsTestProject>).
      - name: Sidecar unit tests (if a test project exists)
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Recurse -Filter *.csproj -File |
            Where-Object { $_.FullName -notmatch '[\\/](node_modules|bin|obj|target)[\\/]' } |
            Where-Object { Select-String -LiteralPath $_.FullName -Quiet -Pattern 'Microsoft\.NET\.Test\.Sdk|<IsTestProject>\s*true' })
          if ($projects.Count -eq 0) { Write-Host "No sidecar test project yet - skipping dotnet test."; exit 0 }
          foreach ($p in $projects) {
            Write-Host "dotnet test $($p.FullName)"
            dotnet test $p.FullName -c Release --logger "console;verbosity=normal"
            if ($LASTEXITCODE -ne 0) { throw "dotnet test failed for $($p.Name)" }
          }

      # Read-only protocol check: only 'interval' and 'shutdown' are sent. Never add
      # fan commands here.
      - name: Sidecar protocol smoke test
        shell: pwsh
        run: |
          # The agent reads stdin during the (slow) hardware open and honours 'shutdown'
          # at once, so wait for real telemetry lines instead of sleeping a fixed time.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path build/agent/nexum-agent.exe).Path
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $errTask = $p.StandardError.ReadToEndAsync()
          $p.StandardInput.WriteLine('{"cmd":"interval","ms":500}')
          $p.StandardInput.Flush()
          $lines = New-Object System.Collections.Generic.List[string]
          $telemetrySeen = 0
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $pending = $p.StandardOutput.ReadLineAsync()
          while ($sw.Elapsed.TotalSeconds -lt 60 -and $telemetrySeen -lt 3) {
            if (-not $pending.Wait(500)) { continue }
            $l = $pending.Result
            if ($null -eq $l) { break }
            if ($l.Trim()) { $lines.Add($l) }
            if ($l -match '"type":"telemetry"') { $telemetrySeen++ }
            $pending = $p.StandardOutput.ReadLineAsync()
          }
          Write-Host "first $telemetrySeen telemetry packet(s) after $([int]$sw.Elapsed.TotalMilliseconds) ms"
          $p.StandardInput.WriteLine('{"cmd":"shutdown"}')
          $p.StandardInput.Close()
          while ($pending.Wait(15000)) {
            $l = $pending.Result
            if ($null -eq $l) { break }
            if ($l.Trim()) { $lines.Add($l) }
            $pending = $p.StandardOutput.ReadLineAsync()
          }
          if (-not $p.WaitForExit(15000)) { $p.Kill(); Write-Host $errTask.Result; throw "sidecar did not exit after shutdown" }
          Write-Host "--- agent stderr ---"; Write-Host $errTask.Result; Write-Host "--------------------"
          if ($p.ExitCode -ne 0) { throw "sidecar exit code $($p.ExitCode)" }
          if ($lines.Count -lt 2) { throw "expected hello + telemetry lines, got $($lines.Count)" }
          $types = foreach ($l in $lines) { ($l | ConvertFrom-Json -ErrorAction Stop).type }
          Write-Host "types in order: $($types -join ', ')"
          if ($types[0] -ne 'hello') { throw "first line must be hello, got $($types[0])" }
          if (-not ($types -contains 'telemetry')) { throw "no telemetry packet emitted" }
          $t = ($lines | Where-Object { $_ -match '"type":"telemetry"' } | Select-Object -First 1) | ConvertFrom-Json
          foreach ($k in 'ts','cpu','ram','fans','disks','gpus','fanPreset','fanSafety') { if (-not ($t.PSObject.Properties.Name -contains $k)) { throw "telemetry missing '$k'" } }
          # Protocol 3 (CONTRACT 1.1.0, §1.1).
          $h = $lines[0] | ConvertFrom-Json
          if ($h.protocol -ne 3) { throw "hello.protocol is '$($h.protocol)', CONTRACT 1.1.0 expects 3" }
          foreach ($k in 'sensorDriver','fanFlag') { if (-not ($h.PSObject.Properties.Name -contains $k)) { throw "hello missing '$k' (CONTRACT §1.1)" } }
          Write-Host "sensorDriver: $($h.sensorDriver | ConvertTo-Json -Compress) fanFlag: $($h.fanFlag)"
          Write-Host "OK: $($lines.Count) protocol lines, types: $(($types | Select-Object -Unique) -join ', ')"

      # CONTRACT §1.6 / §1.7.2 on the disposable runner: write:true tuning probe rejected,
      # no PresentMon without --presentmon, trust check accepts the pinned Intel exe,
      # Job Object kills PresentMon with the agent, no orphaned NexumFrames ETW session
      # after a clean stop (ROADMAP §4.3 gate 3). Sends no fan or tuning-write command.
      - name: Sidecar frame capture + tuning guard smoke test
        shell: pwsh
        run: ./.github/scripts/smoke-frames.ps1 -Agent build/agent/nexum-agent.exe -PresentMon build/presentmon/PresentMon-2.6.0-x64.exe

      - name: Rust tests (cleaner safety, parsing)
        working-directory: src-tauri
        run: cargo test --lib --locked
        env:
          RUST_BACKTRACE: 1

      # Bundle formats come from bundle.targets in src-tauri/tauri.conf.json (single
      # source of truth, documented in docs/SIGNING.md).
      - name: Build Nexum (exe + installers)
        shell: pwsh
        run: |
          $targets = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).bundle.targets
          Write-Host "bundle.targets: $($targets -join ', ')"
          npm run tauri -- build
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/portable | Out-Null
          Copy-Item src-tauri/target/release/Nexum.exe out/portable/
          Copy-Item "src-tauri/target/release/nexum-agent.exe" out/portable/ -ErrorAction SilentlyContinue
          if (-not (Test-Path out/portable/nexum-agent.exe)) { Copy-Item build/agent/nexum-agent.exe out/portable/ }
          # MF-8 item 1: with IncludeNativeLibrariesForSelfExtract=false the agent's native
          # libraries ship next to nexum-agent.exe instead of extracting to %TEMP%\.net.
          Get-ChildItem build/agent -File -Filter *.dll | ForEach-Object { Copy-Item $_.FullName out/portable/ -Force }
          Copy-Item LICENSE out/portable/
          if (Test-Path licenses) { Copy-Item licenses out/portable/licenses -Recurse -Force }
          # CONTRACT §2.13: Nexum.exe resolves resources next to itself, so the portable
          # build carries presentmon/<exe> exactly like the installer does.
          $pm = (Get-Content .github/presentmon.json -Raw | ConvertFrom-Json)
          New-Item -ItemType Directory -Force out/portable/presentmon | Out-Null
          Copy-Item $pm.dest "out/portable/presentmon/$($pm.asset)" -Force
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object { Copy-Item $_.FullName out/ }
          Get-ChildItem out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      # Unpacks the installers (7-Zip for NSIS incl. $PLUGINSDIR, msiexec /a for MSI)
      # and does a silent test install to capture uninstall.exe. Report-only.
      - name: Expand installers for inspection
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/expand-installers.ps1 -InstallerDir out -Dest build/inspect -Install

      - name: Forbidden kernel drivers (MF-3)
        run: node .github/scripts/check-forbidden-drivers.mjs build/agent src-tauri/target/release/bundle out build/inspect

      # MF-8 item 7 / CONTRACT §7.7: PresentMon ships exactly as Intel signed it (pinned
      # SHA-256, Valid, CN=Intel Corporation) in the portable build and, when the
      # installer could be unpacked, in the installer and the test-install image.
      # Always enforcing, independent of NEXUM_SIGNING_ENABLED.
      - name: PresentMon shipped unmodified (MF-8 item 7)
        shell: pwsh
        run: |
          $req = @('out/portable')
          if (Test-Path build/inspect) { $req += 'build/inspect' } else { Write-Host "::warning::installers were not unpacked; PresentMon checked in the portable build only" }
          ./.github/scripts/check-presentmon-shipped.ps1 -Label 'PresentMon (unsigned build)' -Path out/portable, build/inspect, src-tauri/target/release/presentmon -Require $req
          if ($LASTEXITCODE -ne 0) { throw "PresentMon check failed" }

      # MF-8: Authenticode status of every PE that ships or runs at install time.
      # Report-only while the build is unsigned; enforcing once the repository
      # variable NEXUM_SIGNING_ENABLED is 'true' (signing inside the build) and
      # always in the sign job below.
      - name: Authenticode report (MF-8)
        shell: pwsh
        env:
          ENFORCE: ${{ vars.NEXUM_SIGNING_ENABLED == 'true' }}
        run: |
          $enforce = $env:ENFORCE -eq 'true'
          $failed = 0
          $installers = @(Get-ChildItem out -File | Where-Object { $_.Extension -in '.exe', '.msi' } | ForEach-Object FullName)
          $checks = @(
            @{ Label = 'installers';                    Path = $installers },
            @{ Label = 'portable';                      Path = @('out/portable') },
            @{ Label = 'installer contents + install image'; Path = @('build/inspect') },
            @{ Label = 'bundler NSIS plugins (Plugins/x86-unicode)'; Path = @("$env:LOCALAPPDATA/tauri/NSIS/Plugins") }
          )
          foreach ($c in $checks) {
            if (-not $c.Path) { Write-Host "::warning::[$($c.Label)] nothing to check"; continue }
            & ./.github/scripts/check-authenticode.ps1 -Label $c.Label -Path $c.Path -Enforce:$enforce
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { throw "$failed Authenticode check(s) failed" }

      # MF-8 item 4: hashes of exactly what is uploaded below.
      - name: SHA-256 hashes
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out -File | Where-Object { $_.Extension -in '.exe', '.msi' }) + @(Get-ChildItem out/portable -Recurse -File)
          $lines = foreach ($f in $files) {
            $rel = (Resolve-Path -Relative $f.FullName) -replace '^[.][\\/]', '' -replace '\\', '/'
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant(), $rel
          }
          New-Item -ItemType Directory -Force build/hashes | Out-Null
          $lines | Set-Content -Encoding ascii build/hashes/SHA256SUMS-unsigned.txt
          $lines | ForEach-Object { Write-Host $_ }
          "### SHA-256 (unsigned build)`n`n``````text`n$($lines -join "`n")`n```````n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload portable binaries (unsigned)
        id: upload-portable
        uses: actions/upload-artifact@v5
        with:
          name: nexum-portable-unsigned
          path: out/portable/
          if-no-files-found: error

      - name: Upload installers (unsigned)
        id: upload-installers
        uses: actions/upload-artifact@v5
        with:
          name: nexum-installers-unsigned
          path: |
            out/*.exe
            out/*.msi
          if-no-files-found: error

      - name: Upload SHA-256 list (unsigned)
        uses: actions/upload-artifact@v5
        with:
          name: nexum-sha256-unsigned
          path: build/hashes/SHA256SUMS-unsigned.txt
          if-no-files-found: error

    outputs:
      portable-artifact-id: ${{ steps.upload-portable.outputs.artifact-id }}
      installers-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}

  # Code signing via SignPath Foundation (free for open source).
  # Runs only for release tags (not -preview tags) once the project is approved and the
  # SIGNPATH_API_TOKEN secret plus SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG
  # variables are configured. See docs/SIGNING.md.
  sign:
    name: Sign release (SignPath)
    needs: [build, policy]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-preview') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sign installers
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ needs.build.outputs.installers-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installers

      - name: Sign portable binaries
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: portable
          github-artifact-id: ${{ needs.build.outputs.portable-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/portable

      - name: Expand signed installers for inspection
        shell: pwsh
        run: ./.github/scripts/expand-installers.ps1 -InstallerDir signed/installers -Dest build/inspect-signed -Install

      - name: Forbidden kernel drivers (MF-3)
        run: node .github/scripts/check-forbidden-drivers.mjs signed build/inspect-signed

      # MF-8: everything that ships or runs must be 'Valid'. This includes the files
      # inside the installers (NSIS $PLUGINSDIR, MSI payload) and the installed
      # image with uninstall.exe. A failure here blocks the release.
      - name: Authenticode must be Valid (MF-8)
        shell: pwsh
        run: |
          $failed = 0
          foreach ($c in @(
            @{ Label = 'signed installers';                  Path = @('signed/installers') },
            @{ Label = 'signed portable';                    Path = @('signed/portable') },
            @{ Label = 'installer contents + install image'; Path = @('build/inspect-signed') }
          )) {
            & ./.github/scripts/check-authenticode.ps1 -Label $c.Label -Path $c.Path -Enforce
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { throw "$failed Authenticode check(s) failed - not publishing" }

      # MF-8 item 7: SignPath must not have re-signed Intel's PresentMon. A re-signed copy
      # has a different SHA-256 and would also fail the agent's pinned-hash check at runtime.
      - name: PresentMon not re-signed (MF-8 item 7)
        shell: pwsh
        run: |
          ./.github/scripts/check-presentmon-shipped.ps1 -Label 'PresentMon (signed release)' -Path signed, build/inspect-signed -Require signed/portable, build/inspect-signed
          if ($LASTEXITCODE -ne 0) { throw "PresentMon check failed - not publishing" }

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path signed/portable/* -DestinationPath "signed/Nexum_${{ github.ref_name }}_x64-portable.zip"

      # MF-8 item 4: SHA-256 of every release file, attached to the release.
      - name: SHA-256 hashes and release notes
        shell: pwsh
        run: |
          $files = @(Get-ChildItem signed/installers -File) + @(Get-ChildItem signed -File -Filter 'Nexum_*_x64-portable.zip')
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant(), $f.Name }
          $lines | Set-Content -Encoding ascii signed/SHA256SUMS.txt
          $lines | ForEach-Object { Write-Host $_ }
          $repo = "${{ github.server_url }}/${{ github.repository }}"
          @(
            "Signed release built from tag ``${{ github.ref_name }}`` (commit ${{ github.sha }}) by GitHub Actions.",
            "",
            "Verify your download before running it: ``Get-FileHash -Algorithm SHA256 <file>`` must match ``SHA256SUMS.txt``, and ``Get-AuthenticodeSignature <file>`` must report ``Valid``.",
            "",
            '```text', ($lines -join "`n"), '```',
            "",
            "Code signing policy: $repo#code-signing-policy · Security: $repo/blob/main/SECURITY.md"
          ) -join "`n" | Set-Content -Encoding utf8 signed/RELEASE_NOTES.md

      - name: Publish GitHub release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: signed/RELEASE_NOTES.md
          files: |
            signed/installers/*
            signed/Nexum_*_x64-portable.zip
            signed/SHA256SUMS.txt

  # MF-8 item 5: SignPath Foundation only signs projects that are already released.
  # Tags like v1.0.0-preview.1 publish the UNSIGNED CI build as a GitHub pre-release
  # to build that history. These builds do not run with Smart App Control on.
  preview:
    name: Preview release (unsigned)
    needs: [build, policy]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: nexum-installers-unsigned
          path: preview/installers

      - uses: actions/download-artifact@v6
        with:
          name: nexum-portable-unsigned
          path: preview/portable

      - name: Label files, zip portable, hash, write notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Get-ChildItem preview/installers -File | ForEach-Object {
            Copy-Item $_.FullName ("release/{0}-UNSIGNED-PREVIEW{1}" -f $_.BaseName, $_.Extension)
          }
          Compress-Archive -Path preview/portable/* -DestinationPath "release/Nexum_${tag}_x64-portable-UNSIGNED-PREVIEW.zip"
          $lines = foreach ($f in Get-ChildItem release -File) { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant(), $f.Name }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
          $lines | ForEach-Object { Write-Host $_ }
          $repo = "${{ github.server_url }}/${{ github.repository }}"
          @(
            "> [!WARNING]",
            "> **Preview — unsigned — will not run with Smart App Control on.**",
            "> These files are NOT code-signed. Windows Smart App Control blocks them and SmartScreen warns about them.",
            "> They are published so the project has a public release history (a SignPath Foundation requirement).",
            "> Test them in a virtual machine or on a PC with Smart App Control off. Signed releases follow once code signing is approved.",
            "",
            "Built from tag ``$tag`` (commit ${{ github.sha }}) by GitHub Actions, workflow run ${{ github.run_id }}.",
            "Nexum runs as Administrator, can control fans and, only if you turn frame capture on, starts the bundled Intel-signed PresentMon: read the [README]($repo#readme) and [SECURITY.md]($repo/blob/main/SECURITY.md) first.",
            "",
            "SHA-256:",
            '```text', ($lines -join "`n"), '```',
            "",
            "Code signing policy: $repo#code-signing-policy"
          ) -join "`n" | Set-Content -Encoding utf8 release/RELEASE_NOTES.md

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nexum ${{ github.ref_name }} — Preview — unsigned — will not run with Smart App Control on"
          prerelease: true
          make_latest: false
          draft: false
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.exe
            release/*.msi
            release/*.zip
            release/SHA256SUMS.txt
